                        fullDesc: `<p><span class="text-brand-red font-bold">Задача:</span> представить на российском рынке немецкий препарат для горла с уникальным тройным составом.</p><p class="mt-4"><span class="text-white font-bold">Решение:</span> запуск построили на доверии к немецким стандартам: «Доритрицин — то, чем лечат горло в Германии». Игровая считалка Eins! Zwei! Drei! раскрывает три действия: блокирует боль, препятствует развитию инфекции, избавляет от бактерий, грибков и вирусов. «Немецкие стандарты GMP требуют тройного контроля» — аргумент, который закрепляет премиальное происхождение бренда.</p><p class="mt-4"><span class="text-brand-cyan font-bold">Результат:</span> заметный запуск «Теперь и в России!» с понятной дифференциацией через тройной состав и немецкое качество.</p>`,
                        media: [
                            { kind: 'video', span: 'wide', src: 'videos/farma/doritricin-roll.mp4', label: 'Ролик: Eins! Zwei! Drei!' },
                            { kind: 'kv', span: 'wide', src: 'images/farma/doritricin-kv-1.jpg', label: 'KV: «то, чем лечат горло в Германии»' },
                            { kind: 'banner', span: 'tall', src: 'images/farma/doritricin-banner-1.jpg', label: 'Интернет-баннер: «Теперь и в России!»' }
                        ]
                    },
                    {
                        slug: 'epigen', title: 'Эпиген гель', client: '',
                        category: 'Коммуникация · ролик', color: 'text-brand-cyan', tags: ['creative'],
                        shortDesc: 'Доверительная и точная коммуникация для деликатной категории.',
                        keyMessage: '',
                        fullDesc: `<p><span class="text-brand-red font-bold">Задача:</span> коммуникационно-креативное решение, ролик и макеты для Эпиген гель — деликатная категория, требующая доверительной и точной коммуникации.</p><p class="mt-4"><span class="text-brand-cyan font-bold">Что сделано:</span> коммуникационно-креативное решение, ролик, макеты с аккуратным визуальным языком и корректной подачей.</p>`,
                        media: [
                            { kind: 'video', span: 'wide', src: 'videos/farma/epigen-roll.mp4', label: 'Ролик: деликатная коммуникация' },
                            { kind: 'kv', span: 'wide', src: 'images/farma/epigen-kv-1.jpg', label: 'KV: ключевой визуал' },
                            { kind: 'banner', span: 'tall', src: 'images/farma/epigen-banner-1.jpg', label: 'Интернет-баннер: ключевой визуал' }
                        ]
                    },
                    {
                        slug: 'meditonzin', title: 'Медитонзин', client: '',
                        category: 'Коммуникация · digital', color: 'text-brand-sky', tags: ['creative'],
                        shortDesc: '«Бережен к иммунитету. Спасибо его авторам»: немецкий подход к простуде, подтверждённый клинически.',
                        keyMessage: 'Немецкие учёные разбираются с простудой',
                        fullDesc: `<p><span class="text-brand-red font-bold">Задача:</span> коммуникация для немецкого препарата от простуды: объяснить преимущества и повысить доверие.</p><p class="mt-4"><span class="text-white font-bold">Решение:</span> «Медитонзин: немецкие учёные разбираются с простудой» — борется с основными симптомами простуды, повышает собственные защитные силы организма и помогает предотвратить осложнения. Тёплый слоган «Бережен к иммунитету. Спасибо его авторам» и аргумент эффективности: клинические исследования с участием почти 4000 пациентов, в том числе детей от 7 месяцев.</p>`,
                        media: [
                            { kind: 'video', span: 'wide', src: 'videos/farma/meditonzin-roll.mp4', label: 'Ролик: немецкие учёные' },
                            { kind: 'kv', span: 'wide', src: 'images/farma/meditonzin-kv-1.jpg', label: 'KV: «Бережен к иммунитету»' },
                            { kind: 'banner', span: 'tall', src: 'images/farma/meditonzin-banner-1.jpg', label: 'Интернет-баннер: клинические доказательства' }
                        ]
                    }
                ],

                get active() {
                    return this.cases.find(c => c.slug === this.activeCase) || null;
                },

                filteredCases() {
                    if (this.filter === 'all') return this.cases;
                    return this.cases.filter(c => c.tags.includes(this.filter));
                },

                init() {
                    this.updateCols();
                    window.addEventListener('resize', () => this.updateCols());
                    const h = window.location.hash.replace('#', '');
                    if (h && this.cases.some(c => c.slug === h)) {
                        this.activeCase = h;
                        this.$nextTick(() => this.scrollToDetail());
                    }
                },

                updateCols() {
                    const w = window.innerWidth;
                    this.cols = w >= 1024 ? 3 : (w >= 768 ? 2 : 1);
                },

                rowOf(i) {
                    return Math.floor(i / this.cols);
                },

                showDetailAfter(i) {
                    if (!this.activeCase) return false;
                    const list = this.filteredCases();
                    const ai = list.findIndex(c => c.slug === this.activeCase);
                    if (ai < 0) return false;
                    const row = this.rowOf(ai);
                    if (this.rowOf(i) !== row) return false;
                    const isLastInRow = (i === list.length - 1) || this.rowOf(i + 1) !== row;
                    return isLastInRow;
                },

                openPanel(slug) {
                    this.activeCase = (this.activeCase === slug) ? null : slug;
                    if (this.activeCase) {
                        this.setHash(slug);
                        this.$nextTick(() => this.scrollToDetail());
                    } else {
                        this.setHash('');
                    }
                },

                closePanel() {
                    if (this.activeCase) {
                        this.activeCase = null;
                        this.setHash('');
                    }
                },

                setFilter(key) {
                    this.filter = key;
                    if (this.activeCase && !this.filteredCases().some(c => c.slug === this.activeCase)) {
                        this.activeCase = null;
                        this.setHash('');
                    }
                },

                scrollToDetail() {
                    const el = document.getElementById('case-detail');
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                },

                setHash(slug) {
                    try {
                        history.replaceState(null, '', slug ? '#' + slug : window.location.pathname + window.location.search);
                    } catch (e) {}
                },

                isVideo(url) {
                    return url.endsWith('.mp4') || url.endsWith('.webm');
                },

                mediaIcon(kind) {
                    return { video: '🎬', kv: '🖼️', banner: '🖥️' }[kind] || '📁';
                }
            }
        }
    </script>
</head>
<body class="antialiased min-h-screen flex flex-col relative overflow-x-hidden">

  <!-- Background FX -->
  <div class="fixed inset-0 z-0 pointer-events-none">
    <div class="absolute top-[-10%] right-[-5%] w-[40vw] h-[40vw] bg-brand-cyan/5 rounded-full blur-[100px]"></div>
    <div class="absolute bottom-[-10%] left-[-5%] w-[40vw] h-[40vw] bg-brand-red/5 rounded-full blur-[100px]"></div>
    <div class="scanlines absolute inset-0 z-10"></div>
    <div class="bg-watermark text-white select-none glitch-quiet" data-text="ФАРМА">ФАРМА</div>
  </div>

  <div x-data="farmaData()" x-cloak x-init="init()" @keydown.escape="closePanel()">

    <!-- HEADER -->
    <header class="border-b border-brand-border/30 backdrop-blur-md sticky top-0 z-50 bg-brand-bg/80">
      <div class="container mx-auto px-4 py-3 flex justify-between items-center">
        <a href="index.html" class="flex items-center gap-3">
          <span class="glitch-quiet text-lg sm:text-xl uppercase tracking-tight" data-text="ПЕРЕДВИЖНИКИ 2.0">ПЕРЕДВИЖНИКИ 2.0</span>
        </a>
        <nav class="hidden md:flex gap-6 text-sm font-semibold text-brand-muted tracking-wide">
          <a href="index.html#gallery" class="hover:text-brand-cyan transition-colors">Кейсы</a>
          <a href="experience.html" class="hover:text-brand-cyan transition-colors">Опыт</a>
          <a href="index.html#contact" class="hover:text-brand-cyan transition-colors">Контакты</a>
        </nav>
        <a href="index.html#contact" class="px-5 py-2 bg-brand-red/90 text-white rounded-lg text-sm font-bold hover:bg-brand-red transition-colors shadow-[0_0_10px_rgba(255,59,92,0.3)]">Обсудить проект</a>
      </div>
    </header>

    <!-- HERO -->
    <section class="relative px-4 pt-16 pb-10 lg:pt-24 lg:pb-12">
      <div class="container mx-auto max-w-5xl text-center z-10 relative">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brand-surface/40 border border-brand-cyan/30 text-brand-cyan text-xs font-bold uppercase tracking-wider mb-8">
          <span class="w-1.5 h-1.5 rounded-full bg-brand-cyan animate-pulse"></span> 20+ лет в фарме · OTC и Rx
        </div>

        <h1 class="text-5xl sm:text-6xl lg:text-7xl font-black mb-6 leading-[0.95] tracking-tight">
          <span class="glitch-hero" data-text="Кейсы: Фарма">Кейсы: Фарма</span>
        </h1>

        <p class="text-brand-muted text-lg max-w-2xl mx-auto leading-relaxed">
          Запуски, репозиционирование и креативные кампании, которые выводили бренды в лидеры категорий
        </p>
      </div>
    </section>

    <!-- FILTER + GRID -->
    <section id="cases" class="relative z-10 px-4 pb-24">
      <div class="container mx-auto max-w-6xl">

        <div class="flex flex-wrap gap-2 justify-center mb-12">
          <button @click="setFilter('all')"
                  class="px-4 py-2 rounded-lg text-sm font-bold border transition-colors"
                  :class="filter === 'all' ? 'bg-brand-cyan text-brand-bg border-brand-cyan' : 'border-brand-border/60 text-brand-muted hover:text-white'">
            Все кейсы
          </button>
          <template x-for="(label, key) in tags" :key="key">
            <button @click="setFilter(key)"
                    class="px-4 py-2 rounded-lg text-sm font-bold border transition-colors"
                    :class="filter === key ? 'bg-brand-cyan text-brand-bg border-brand-cyan' : 'border-brand-border/60 text-brand-muted hover:text-white'"
                    x-text="label"></button>
          </template>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <template x-for="(c, i) in filteredCases()" :key="c.slug">
            <div class="contents">

              <!-- КАРТОЧКА КЕЙСА -->
              <article @click="openPanel(c.slug)"
                       class="glass-card rounded-2xl p-7 cursor-pointer flex flex-col gap-4 group"
                       :class="activeCase === c.slug ? '!border-brand-cyan shadow-[0_0_30px_rgba(0,229,255,0.15)]' : ''">
                <div class="flex items-center justify-between gap-2">
                  <span class="text-[10px] font-bold uppercase tracking-widest" :class="c.color" x-text="c.category"></span>
                </div>
                <h3 class="text-2xl font-bold text-white group-hover:text-brand-cyan transition-colors" x-text="c.title"></h3>
                <p class="text-brand-muted text-sm leading-relaxed" x-text="c.shortDesc"></p>
                <p class="text-xs font-mono text-brand-muted/70" x-show="c.client" x-text="c.client"></p>
                <div class="flex flex-wrap gap-2 mt-auto pt-2">
                  <template x-for="t in c.tags" :key="t">
                    <span class="px-2 py-1 text-xs font-mono bg-brand-surface/60 border border-brand-border/30 rounded text-brand-sky" x-text="tags[t]"></span>
                  </template>
                </div>
                <div class="text-xs font-mono text-brand-muted/70 group-hover:text-brand-cyan transition-colors pt-2"
                     x-text="activeCase === c.slug ? 'Свернуть ↑' : 'Смотреть кейс →'"></div>
              </article>

              <!-- ПАНЕЛЬ КЕЙСА МЕЖДУ РЯДАМИ -->
              <template x-if="showDetailAfter(i)">
                <div id="case-detail"
                     class="col-span-full scroll-mt-24 bg-[#081121] border border-brand-cyan/20 rounded-2xl p-6 lg:p-10"
                     x-transition:enter="transition ease-out duration-300"
                     x-transition:enter-start="opacity-0 translate-y-4"
                     x-transition:enter-end="opacity-100 translate-y-0">

                  <div class="flex flex-col gap-8" x-cloak>

                    <div class="flex items-center justify-between gap-4">
                      <span class="text-xs font-mono text-brand-muted/60">// кейс раскрыт между строк — сетка выше и ниже сохранена</span>
                      <button @click="closePanel()" class="text-brand-muted hover:text-white text-sm font-mono flex items-center gap-2 transition-colors">
                        <span class="text-xl">←</span> Свернуть
                      </button>
                    </div>

                    <div>
                      <h3 class="text-sm font-bold uppercase tracking-widest mb-2" :class="active.color" x-text="active.category"></h3>
                      <p class="text-xs font-mono text-brand-muted mb-4" x-show="active.client" x-text="'Клиент: ' + active.client"></p>
                      <h2 class="text-3xl lg:text-5xl font-bold" x-text="active.title"></h2>
                    </div>

                    <blockquote class="border-l-4 border-brand-cyan pl-6 py-3 bg-brand-surface/30 rounded-r-lg text-white font-semibold text-lg"
                                x-show="active.keyMessage" x-text="active.keyMessage"></blockquote>

                    <div class="text-brand-muted text-lg leading-relaxed space-y-5 max-w-4xl" x-html="active.fullDesc"></div>

                    <div>
                      <h4 class="text-sm font-bold uppercase tracking-widest text-brand-muted mb-6">Материалы кейса</h4>
                      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <template x-for="(m, mi) in active.media" :key="mi">
                          <div x-data="{ missing: false }"
                               class="relative rounded-xl overflow-hidden"
                               :class="m.span === 'wide' ? 'md:col-span-2 aspect-video' : 'aspect-[3/4]'">

                            <!-- Заглушка: показывает, какой файл куда положить -->
                            <div x-show="missing" class="placeholder-box absolute inset-0 flex flex-col items-center justify-center gap-2 p-4 text-center">
                              <span class="text-3xl opacity-60" x-text="mediaIcon(m.kind)"></span>
                              <span class="text-sm font-mono text-brand-muted" x-text="m.label"></span>
                              <span class="text-[11px] font-mono text-brand-cyan/80 break-all" x-text="m.src"></span>
                              <span class="text-[10px] uppercase tracking-widest text-brand-muted/50"
                                    x-text="isVideo(m.src) ? 'положи ролик с этим именем в videos/farma' : 'положи файл с этим именем в images/farma'"></span>
                            </div>

                            <template x-if="!isVideo(m.src)">
                              <img :src="m.src" :alt="m.label" @error="missing = true" x-show="!missing"
                                   class="absolute inset-0 w-full h-full object-cover">
                            </template>
                            <template x-if="isVideo(m.src)">
                              <video :src="m.src" controls @error="missing = true" x-show="!missing"
                                     class="absolute inset-0 w-full h-full object-cover"></video>
                            </template>

                          </div>
                        </template>
                      </div>
                    </div>

                    <div class="pt-6 border-t border-brand-border/30">
                      <a href="index.html#contact" class="inline-flex items-center gap-3 text-brand-cyan hover:text-white font-bold text-xl transition-colors group">
                        <span class="text-3xl group-hover:translate-x-2 transition-transform">→</span>
                        Обсудить похожий проект
                      </a>
                    </div>

                  </div>
                </div>
              </template>

            </div>
          </template>
        </div>

      </div>
    </section>

    <!-- FOOTER -->
    <footer class="border-t border-brand-border/30 py-8 text-center text-brand-muted text-xs mt-auto relative z-20">
      <div class="container mx-auto px-4">
        <p class="mb-2">&copy; 2026 Передвижники 2.0. Human + AI Agency.</p>
        <p class="opacity-50">Кейсы: Фарма · 21 кейс.</p>
      </div>
    </footer>

  </div>
</body>
